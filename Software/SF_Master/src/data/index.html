<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Flap Control</title>
    <style>
        body {
            background: #181a1b;
            color: #f5f6fa;
            font-family: 'Roboto Mono', monospace;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .splitflap {
            display: flex;
            gap: 0.5rem;
        }
        .flap {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            position: relative;
        }
        .flap::after {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 50%;
            height: 1px;
            background: #444;
        }
        h1 {
            font-size: 2.5rem;
            letter-spacing: 0.2em;
            text-shadow: 0 2px 8px #000a;
            text-align: center;
        }
        #letters-preview {
            margin-top: 1rem;
        }
        header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 0.2rem;
            margin-bottom: 0.2rem;
        }
        header .splitflap {
            gap: 0.5rem;
        }
        header .flap {
            width: 1.6rem;
            height: 2.4rem;
            font-size: 1.7rem;
        }
        header h1 {
            font-size: 1.3rem;
            letter-spacing: 0.15em;
            text-shadow: 0 2px 8px #000a;
            font-weight: 700;
        }

        .split-flap-panel {
            perspective: 20cm;
            perspective-origin: 50% 20%;
        }
        .flap, .splitflap-character, .splitflap-character .animated-flap {
            width: 2.5rem;
            font-size: 3.5rem;
            line-height: 3.5rem;
        }
        .flap, .splitflap-character, .splitflap-character .animated-flap.flap-current {
            height: 3.5rem;
        }
        .splitflap-character .animated-flap.flap-current-flipper, .splitflap-character .animated-flap.flap-next-flipper, .splitflap-character .animated-flap.flap-next-top  {
            height: 1.75rem; /* half the height of a full flap */
            display: none;
        }

        .splitflap-character {
            transform-style: preserve-3d;
            display: inline-block;
        }
        .flap, .splitflap-character .animated-flap {
            background: #222;
            border-radius: 6px;
            font-family: 'Roboto Mono', monospace;
            color: #ffe066;
        }
            
        .splitflap-character .animated-flap {
            position: absolute;
            top: 0px;
            left: 0px;
            overflow: hidden;
            text-align: center;
        }
        .flap, .splitflap-character .animated-flap.flap-current {
            border-bottom: 2px solid #444;
            box-shadow: 0 4px 16px #000a;
        }
        .animated-flap.flap-current::after {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 50%;
            height: 1px;
            background: #444;
        }
        .splitflap-character .animated-flap.flap-current-flipper {
            transform-origin: bottom;
            transform: rotateX(0deg);
            /* background-image: linear-gradient(transparent, rgba(0, 0, 0, 0.5)); */
        }
        .splitflap-character .animated-flap.flap-next-flipper {
            transform-origin: bottom;
            transform: rotateX(2deg);
        }
        .splitflap-character .animated-flap.flap-next-flipper span {
            display: inline-block;
            transform: scaleY(-1);
        }
        .splitflap-character.animate .animated-flap.flap-current-flipper,
        .splitflap-character.animate .animated-flap.flap-next-flipper {
            /* animation: flipper 0.75s cubic-bezier(0.6, 0.14, 0.99, 0.24); */
            animation: flipper 600ms cubic-bezier(0.4, 0, 1, 1);
        }
        .splitflap-character.animate .animated-flap.flap-next-flipper {
            animation-delay: 16ms;
        }
        .splitflap-character.animate .animated-flap.flap-next-top, 
        .splitflap-character.animate .animated-flap.flap-current-flipper,
        .splitflap-character.animate .animated-flap.flap-next-flipper {
            display: initial;
        }

        @keyframes flipper {
            0% {
                transform: rotateX(359deg);
            }
            100% {
                transform: rotateX(180deg);
            }
        }
        @keyframes flipper-text {
            0% {
                transform: scaleY(1);
            }
            57% {
                transform: scaleY(1);
            }
            58% {
                transform: scaleY(-1);
            }
            100% {
                transform: scaleY(-1);
            }
        }
    </style>
    <!-- Google Fonts for monospace look -->
    <link href="https://fonts.googleapis.com/css?family=Roboto+Mono:700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="splitflap">
            <div class="flap">S</div>
            <div class="flap">F</div>
            <div class="flap">C</div>
        </div>
        <h1>Split Flap Control</h1>
    </header>
    <p>
        Current Letters (6):
        <div id="letters-current" class="splitflap">
            <div class="flap">A</div>
            <div class="flap">B</div>
            <div class="flap">C</div>
            <div class="flap">D</div>
            <div class="flap">E</div>
            <div class="flap">F</div>
        </div>
    </p>
    <p>
        <label for="letters">Set Letters (A-Z, .:/ and space):</label>
        <form action="/set_letters" method="post">
            <input type="text" id="letters" name="letters" maxlength="6" pattern="^[A-Za-z0-9 \.\:\/]{0,6}$" required>
            <button type="submit">Set</button>
        </form>
        <div id="letters-preview" class="split-flap-panel">
            <div class="splitflap-character">
                <div class="animated-flap flap-current"></div>
                <div class="animated-flap flap-next-top"></div>
                <div class="animated-flap flap-current-flipper"></div>
                <div class="animated-flap flap-next-flipper"><span></span></div>
            </div>
            <div class="splitflap-character">
                <div class="animated-flap flap-current"></div>
                <div class="animated-flap flap-next-top"></div>
                <div class="animated-flap flap-current-flipper"></div>
                <div class="animated-flap flap-next-flipper"><span></span></div>
            </div>
            <div class="splitflap-character">
                <div class="animated-flap flap-current"></div>
                <div class="animated-flap flap-next-top"></div>
                <div class="animated-flap flap-current-flipper"></div>
                <div class="animated-flap flap-next-flipper"><span></span></div>
            </div>
            <div class="splitflap-character">
                <div class="animated-flap flap-current"></div>
                <div class="animated-flap flap-next-top"></div>
                <div class="animated-flap flap-current-flipper"></div>
                <div class="animated-flap flap-next-flipper"><span></span></div>
            </div>
            <div class="splitflap-character">
                <div class="animated-flap flap-current"></div>
                <div class="animated-flap flap-next-top"></div>
                <div class="animated-flap flap-current-flipper"></div>
                <div class="animated-flap flap-next-flipper"><span></span></div>
            </div>
            <div class="splitflap-character">
                <div class="animated-flap flap-current"></div>
                <div class="animated-flap flap-next-top"></div>
                <div class="animated-flap flap-current-flipper"></div>
                <div class="animated-flap flap-next-flipper"><span></span></div>
            </div>
        </div>
    </p>
    <script>
        (function updatePreview() {
            let nextToShow;
            let changeInProgress;

            const characters = Array.from(document.querySelectorAll('#letters-preview.split-flap-panel .splitflap-character'));

            const currentCharacterDisplays = characters.map(character => Array.from(character.querySelectorAll('.animated-flap.flap-current, .animated-flap.flap-current-flipper')));
            const nextCharacterDisplays = characters.map(character => Array.from(character.querySelectorAll('.animated-flap.flap-next-top, .animated-flap.flap-next-flipper span')));

            function updateDisplay(letters) {
                nextToShow = null;

                const charactersToAnimate = [];

                for (let i = 0; i < characters.length; i++) {
                    const nextLetter = letters[i] || ' ';
                    for (const nextCharacterDisplay of nextCharacterDisplays[i]) {
                        if (nextCharacterDisplay.innerText === nextLetter) {
                            continue; // No change needed
                        }
                        charactersToAnimate.push(characters[i]);
                        nextCharacterDisplay.innerText = nextLetter;
                    }
                }
                for (character of charactersToAnimate) {
                    character.classList.add('animate');
                }
                changeInProgress = setTimeout(() => {
                    for (character of characters) {
                        character.classList.remove('animate');
                    }
                    for (let i = 0; i < characters.length; i++) {
                        const currentLetter = letters[i] || ' ';
                        for (const currentCharacterDisplay of currentCharacterDisplays[i]) {
                            currentCharacterDisplay.innerText = currentLetter;
                        }
                    }

                    changeInProgress = false;
                    if (nextToShow) {
                        updateDisplay(nextToShow);
                    }
                }, 600 - 16); // Match the animation duration, minus the last bit of the end (e.g the 16ms of delay) due to a flashing end state (FIXME)
            }

            document.getElementById('letters').addEventListener('input', function() {
                let letters = this.value
                    .toUpperCase()
                    .split('')
                    .filter(c => ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.:/'.includes(c))
                    .slice(0, 6);

                if (changeInProgress) {
                    nextToShow = letters;
                    return;
                }

                updateDisplay(letters);
            });
        }());
    </script>
</body>
</html>
