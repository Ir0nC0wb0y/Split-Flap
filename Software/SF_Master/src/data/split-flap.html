    <title>Split Flap Character</title>
    <style>
        .split-flap-panel {
            perspective: 20cm;
            perspective-origin: 50% 20%;
        }
        .splitflap-character, .splitflap-character .flap {
            width: 2.5rem;
            font-size: 3.5rem;
            line-height: 3.5rem;
        }
        .splitflap-character, .splitflap-character .flap.flap-current {
            height: 3.5rem;
        }
        .splitflap-character .flap.flap-current-flipper, .splitflap-character .flap.flap-next-flipper, .splitflap-character .flap.flap-next-top  {
            height: 1.75rem; /* half the height of a full flap */
            display: none;
        }

        .splitflap-character {
            transform-style: preserve-3d;
            display: inline-block;
        }
        .splitflap-character .flap {
            background: #222;
            border-radius: 6px;
            font-family: 'Roboto Mono', monospace;
            color: #ffe066;

            position: absolute;
            top: 0px;
            left: 0px;
            overflow: hidden;
            text-align: center;
        }
        .splitflap-character .flap.flap-current {
            border-bottom: 2px solid #444;
            box-shadow: 0 4px 16px #000a;
        }
        .flap.flap-current::after {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 50%;
            height: 1px;
            background: #444;
        }
        .splitflap-character .flap.flap-current-flipper {
            transform-origin: bottom;
            transform: rotateX(0deg);
            /* background-image: linear-gradient(transparent, rgba(0, 0, 0, 0.5)); */
        }
        .splitflap-character .flap.flap-next-flipper {
            transform-origin: bottom;
            transform: rotateX(2deg);
        }
        .splitflap-character .flap.flap-next-flipper span {
            display: inline-block;
            transform: scaleY(-1);
        }
        .splitflap-character.animate .flap.flap-current-flipper,
        .splitflap-character.animate .flap.flap-next-flipper {
            /* animation: flipper 0.75s cubic-bezier(0.6, 0.14, 0.99, 0.24); */
            animation: flipper 600ms cubic-bezier(0.4, 0, 1, 1);
        }
        .splitflap-character.animate .flap.flap-next-flipper {
            animation-delay: 16ms;
        }
        .splitflap-character.animate .flap.flap-next-top, 
        .splitflap-character.animate .flap.flap-current-flipper,
        .splitflap-character.animate .flap.flap-next-flipper {
            display: initial;
        }

        @keyframes flipper {
            0% {
                transform: rotateX(359deg);
            }
            100% {
                transform: rotateX(180deg);
            }
        }
        @keyframes flipper-text {
            0% {
                transform: scaleY(1);
            }
            57% {
                transform: scaleY(1);
            }
            58% {
                transform: scaleY(-1);
            }
            100% {
                transform: scaleY(-1);
            }
        }
    </style>
</head>

    <script>
        const characterSequence = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.:/ '.split('');
        let currentIndex = 1;
        function flipCharacters() {
            const currentCharacter = characterSequence[currentIndex++];
            if (currentIndex >= characterSequence.length) {
                currentIndex = 0; // Reset index after reaching the end
            }
            const sfcs = Array.from(document.querySelectorAll('.splitflap-character'));

            const currentCharacterDisplays = sfcs.map(character => Array.from(character.querySelectorAll('.flap.flap-current, .flap.flap-current-flipper'))).flat();
            const nextCharacterDisplays = sfcs.map(character => Array.from(character.querySelectorAll('.flap.flap-next-top, .flap.flap-next-flipper span'))).flat();

            for (const nextCharacterDisplay of nextCharacterDisplays) {
                nextCharacterDisplay.innerText = currentCharacter;
            }
            for (character of sfcs) {
                character.classList.add('animate');
            }
            setTimeout(() => {
                for (character of sfcs) {
                    character.classList.remove('animate');
                }
                for (const currentCharacterDisplay of currentCharacterDisplays) {
                    currentCharacterDisplay.innerText = currentCharacter;
                }
                
                setTimeout(flipCharacters, 32);

            }, 600); // Match the animation duration, minus the last bit of the end (e.g the 16ms of delay) due to a flashing end state (FIXME)
        }
        flipCharacters();
    </script>
