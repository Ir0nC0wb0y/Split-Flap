    <title>Split Flap Character</title>
    <style>
        .split-flap-panel {
            perspective: 20cm;
            perspective-origin: 50% 20%;
        }
        .splitflap-character, .splitflap-character .flap {
            width: 2.5rem;
            font-size: 3.5rem;
            line-height: 3.5rem;
        }
        .splitflap-character, .splitflap-character .flap.flap-current {
            height: 3.5rem;
        }
        .splitflap-character .flap.flap-current-flipper, .splitflap-character .flap.flap-next-flipper, .splitflap-character .flap.flap-next-top  {
            height: 1.75rem; /* half the height of a full flap */
            display: none;
        }

        .splitflap-character {
            transform-style: preserve-3d;
            display: inline-block;
        }
        .splitflap-character .flap {
            background: #222;
            border-radius: 6px;
            font-family: 'Roboto Mono', monospace;
            color: #ffe066;

            position: absolute;
            top: 0px;
            left: 0px;
            overflow: hidden;
            text-align: center;
        }
        .splitflap-character .flap.flap-current {
            border-bottom: 2px solid #444;
            box-shadow: 0 4px 16px #000a;
        }
        .flap.flap-current::after {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 50%;
            height: 1px;
            background: #444;
        }
        .splitflap-character .flap.flap-current-flipper {
            transform-origin: bottom;
            transform: rotateX(0deg);
            /* background-image: linear-gradient(transparent, rgba(0, 0, 0, 0.5)); */
        }
        .splitflap-character .flap.flap-next-flipper {
            transform-origin: bottom;
            transform: rotateX(2deg);
        }
        .splitflap-character .flap.flap-next-flipper span {
            display: inline-block;
            transform: scaleY(-1);
        }
        .splitflap-character .flap.flap-current-flipper.animate,
        .splitflap-character .flap.flap-next-flipper.animate {
            /* animation: flipper 0.75s cubic-bezier(0.6, 0.14, 0.99, 0.24); */
            animation: flipper 750ms cubic-bezier(0.4, 0, 1, 1);
        }
        .splitflap-character .flap.flap-next-flipper.animate {
            animation-delay: 16ms;
        }

        @keyframes flipper {
            0% {
                transform: rotateX(359deg);
            }
            100% {
                transform: rotateX(180deg);
            }
        }
        @keyframes flipper-text {
            0% {
                transform: scaleY(1);
            }
            57% {
                transform: scaleY(1);
            }
            58% {
                transform: scaleY(-1);
            }
            100% {
                transform: scaleY(-1);
            }
        }
    </style>
</head>

    <button id="start-button">Start Animation</button>
    <script>
        const characters = ['A', 'N', 'M', 'P', 'Q', 'Y'];
        let currentIndex = 1;
        document.getElementById('start-button').addEventListener('click', function() {
            const currentCharacter = characters[currentIndex++];
            if (currentIndex >= characters.length) {
                currentIndex = 0; // Reset index after reaching the end
            }
            const currentCharacterFlaps = [ ...document.querySelectorAll('.flap.flap-current') ];
            const currentCharacterFlippers = [ ...document.querySelectorAll('.flap.flap-current-flipper') ];
            const nextCharacterTops = [ ...document.querySelectorAll('.flap.flap-next-top') ];
            const nextCharacterFlippers = [ ...document.querySelectorAll('.flap.flap-next-flipper') ];
            const nextCharacterFlippersText = [ ...document.querySelectorAll('.flap.flap-next-flipper span') ];
            for (const nextCharacterTop of nextCharacterTops) {
                nextCharacterTop.innerText = currentCharacter;
                nextCharacterTop.style.display = 'initial';
            }
            for (const nextCharacterFlipperText of nextCharacterFlippersText) {
                nextCharacterFlipperText.innerText = currentCharacter;
            }
            for (const currentCharacterFlipper of currentCharacterFlippers) {
                currentCharacterFlipper.classList.add('animate');
                currentCharacterFlipper.style.display = 'initial';
            }
            for (const nextCharacterFlipper of nextCharacterFlippers) {
                nextCharacterFlipper.classList.add('animate');
                nextCharacterFlipper.style.display = 'initial';
                nextCharacterFlipper.style.opacity = '0';
            }
            setTimeout(() => {
                for (const nextCharacterFlipper of nextCharacterFlippers) {
                    // nextCharacterFlipper.style.display = 'initial';
                    nextCharacterFlipper.style.opacity = '1';
                }
            }, 100);
            setTimeout(() => {
                for (const currentCharacterFlap of currentCharacterFlaps) {
                    currentCharacterFlap.innerText = currentCharacter;
                }
                for (const currentCharacterFlipper of currentCharacterFlippers) {
                    currentCharacterFlipper.style.display = 'none';
                    currentCharacterFlipper.classList.remove('animate');
                    currentCharacterFlipper.innerText = currentCharacter;
                }
                for (const nextCharacterTop of nextCharacterTops) {
                    nextCharacterTop.style.display = 'none';
                }
                for (const nextCharacterFlipper of nextCharacterFlippers) {
                    nextCharacterFlipper.classList.remove('animate');
                    nextCharacterFlipper.style.display = 'none';
                }
            }, 750); // Match the animation duration
        });
